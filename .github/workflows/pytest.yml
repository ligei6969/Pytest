# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Pytest API Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  Pytes-API-Testing:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: Pytest-API-Testing-Demo/requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Pytest-API-Testing-Demo/requirements.txt
        
    - name: Test with pytest
      run: |
        pytest Pytest-API-Testing-Demo/tests

    - name: Archive Pytest test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: SuperTest-test-report
        path: report
          
    - name: Upload Pytest report to GitHub
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Pytest-test-report
        path: report
